<clipPath id="inner"><rect x="9.6" y="9.6" width="56.8" height="106.8" rx="0.8"/></clipPath>
</defs>
<rect width="76" height="126" fill="{{bg}}"/>
<rect x="8.0" y="8.0" width="60" height="110" rx="1.5" fill="none" stroke="{{ink}}" stroke-width="0.2" opacity="1"/>
<rect x="9.1" y="9.1" width="57.8" height="107.8" rx="1.0" fill="none" stroke="{{ink}}" stroke-width="0.12" opacity="1"/>
<path d="M8.4 7.1000000000000005 L9.700000000000001 8.4 L8.4 9.700000000000001 L7.1000000000000005 8.4 Z" fill="{{ink}}"/><path d="M8.4 116.3 L9.700000000000001 117.6 L8.4 118.9 L7.1000000000000005 117.6 Z" fill="{{ink}}"/><path d="M67.6 7.1000000000000005 L68.9 8.4 L67.6 9.700000000000001 L66.3 8.4 Z" fill="{{ink}}"/><path d="M67.6 116.3 L68.9 117.6 L67.6 118.9 L66.3 117.6 Z" fill="{{ink}}"/>
<line x1="24" y1="54" x2="52" y2="54" stroke="{{ink}}" stroke-width="0.18"/><line x1="24" y1="73.5" x2="52" y2="73.5" stroke="{{ink}}" stroke-width="0.18"/>
<image display="{{logo_on}}" href="{{logo}}" x="25" y="55" width="26" height="16" preserveAspectRatio="xMidYMid meet" filter="{{logo_filter}}"/>
