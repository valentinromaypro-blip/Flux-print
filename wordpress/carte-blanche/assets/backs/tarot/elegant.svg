<text display="{{sub_on}}" x="38" y="69.2" text-anchor="middle" font-family="CB Sans" font-size="{{sub_size}}" letter-spacing="0.25" fill="{{ink}}">{{subtitle}}</text>
<text display="{{mark_on}}" x="38" y="66.9" text-anchor="middle" font-family="CB Display" font-size="11" fill="{{ink}}">CB</text>
