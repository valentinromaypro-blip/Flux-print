<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 76 126" width="76mm" height="126mm">
<defs>
<filter id="tint" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="{{ink}}"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<clipPath id="inner"><rect x="9.6" y="9.6" width="56.8" height="106.8" rx="0.8"/></clipPath>
</defs>
<rect width="76" height="126" fill="{{bg}}"/>
<rect x="8.0" y="8.0" width="60" height="110" rx="1.5" fill="none" stroke="{{ink}}" stroke-width="0.25" opacity="1"/>
<circle cx="10.2" cy="10.2" r="0.6" fill="{{ink}}"/><circle cx="10.2" cy="115.8" r="0.6" fill="{{ink}}"/><circle cx="65.8" cy="10.2" r="0.6" fill="{{ink}}"/><circle cx="65.8" cy="115.8" r="0.6" fill="{{ink}}"/>
<line display="{{sub_on}}" x1="16" y1="76.9" x2="26" y2="76.9" stroke="{{ink}}" stroke-width="0.2"/><line display="{{sub_on}}" x1="50" y1="76.9" x2="60" y2="76.9" stroke="{{ink}}" stroke-width="0.2"/>
<image display="{{logo_on}}" href="{{logo}}" x="18" y="49" width="40" height="28" preserveAspectRatio="xMidYMid meet" filter="{{logo_filter}}"/>
<g display="{{title_on}}" transform="translate(0 {{t_dy}})"><text x="38" y="63" text-anchor="middle" font-family="CB Serif" font-size="{{title_size}}" fill="{{ink}}">{{title}}</text></g>
<text display="{{sub_on}}" x="38" y="77.9" text-anchor="middle" font-family="CB Sans" font-size="{{sub_size}}" letter-spacing="0.25" fill="{{ink}}">{{subtitle}}</text>
<text display="{{mark_on}}" x="38" y="66.9" text-anchor="middle" font-family="CB Display" font-size="11" fill="{{ink}}">CB</text>
</svg>
