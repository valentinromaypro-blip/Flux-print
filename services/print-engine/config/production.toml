# Règles de production automatisée (worker).

press = "xerox-iridesse"
sheet = "SRA3"

[batching]
# Imposition des jeux : "pile = jeu", un seul geste de façonnage, toujours le même.
#   Autant de feuilles que de cartes (+1 pour l'étiquette) ; chaque pose porte un jeu entier.
#   Après une coupe du livre au massicot, chaque pile = un jeu complet et trié, avec sa carte
#   d'identification sur le dessus (n° de commande, exemplaire, QR). 18 jeux par livre.
# Autres modes possibles (façonnage plus complexe, moins de feuilles) : "lanes", "cut_stack".
order = "deck_stack"
separators = true          # carte d'identification en tête de chaque jeu
deck_stack_min_decks = 0   # jamais de bascule en mode compact : même geste pour tous les lots

# Créneaux presse (heure de Paris) : à chaque créneau, les jeux payés avant partent en lot…
launch_times = ["11:00", "16:00"]
slot_min_decks = 6         # … s'il y en a au moins 6 (sinon on attend le créneau suivant)
max_wait_hours = 48        # … et de toute façon au bout de 48 h (délai de fabrication promis)
urgent_days = 2            # une commande à expédier dans 2 jours ou moins part tout de suite
max_cut_sheets = 100       # un livre plein (18 jeux) part sans attendre le créneau

# Utilisés seulement par le mode "lanes" :
sheet_cost_eur = 0.25
cut_cost_eur = 1.50
merge_cost_eur = 0.03
min_fill_ratio = 0.90
min_sheets = 1
marks = "edge"          # traits de coupe prolongés (massicot)

[previews]
pages = 2               # aperçus générés pour le client (dos + première face)
width_px = 600
