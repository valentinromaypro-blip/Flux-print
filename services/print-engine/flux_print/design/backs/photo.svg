<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 69.5 94.9" width="69.5mm" height="94.9mm">
<defs>
<filter id="tint" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="{{ink}}"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<clipPath id="inner"><rect x="9.6" y="9.6" width="50.3" height="75.7" rx="0.8"/></clipPath>
</defs>
<rect width="69.5" height="94.9" fill="{{bg}}"/>
<image href="{{photo}}" x="0" y="0" width="69.5" height="94.9" preserveAspectRatio="none"/>
<rect x="8.0" y="8.0" width="53.50" height="78.90" rx="1.5" fill="none" stroke="{{ink}}" stroke-width="0.35" opacity="1"/>
<g display="{{plate_on}}"><circle cx="34.75" cy="47.45" r="14" fill="{{bg}}" fill-opacity="0.9" stroke="{{ink}}" stroke-width="0.45"/>
<circle cx="34.75" cy="47.45" r="12.5" fill="none" stroke="{{ink}}" stroke-width="0.2"/>
</g>
<image display="{{logo_on}}" href="{{logo}}" x="24.75" y="40.45" width="20" height="14" preserveAspectRatio="xMidYMid meet" filter="{{logo_filter}}"/>
<g display="{{title_on}}" transform="translate(0 {{t_dy}})"><text x="34.75" y="47.45" text-anchor="middle" font-family="CB Serif" font-size="{{title_size}}" fill="{{ink}}">{{title}}</text></g>
<text display="{{sub_on}}" x="34.75" y="53.650000000000006" text-anchor="middle" font-family="CB Sans" font-size="{{sub_size}}" letter-spacing="0.25" fill="{{ink}}">{{subtitle}}</text>
</svg>
