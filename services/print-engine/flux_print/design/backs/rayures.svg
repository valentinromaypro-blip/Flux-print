<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 69.5 94.9" width="69.5mm" height="94.9mm">
<defs>
<filter id="tint" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="{{ink}}"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<clipPath id="inner"><rect x="9.6" y="9.6" width="50.3" height="75.7" rx="0.8"/></clipPath>
<pattern id="stripes" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="3.2" fill="{{ink}}" opacity="0.16"/></pattern></defs>
<rect width="69.5" height="94.9" fill="{{bg}}"/>
<rect width="69.5" height="94.9" fill="url(#stripes)"/>
<rect x="8.0" y="8.0" width="53.50" height="78.90" rx="1.5" fill="none" stroke="{{ink}}" stroke-width="0.3" opacity="1"/>
<circle cx="34.75" cy="47.45" r="14.5" fill="{{bg}}" fill-opacity="1" stroke="{{ink}}" stroke-width="0.45"/>
<circle cx="34.75" cy="47.45" r="13.0" fill="none" stroke="{{ink}}" stroke-width="0.2"/>
<image display="{{logo_on}}" href="{{logo}}" x="24.75" y="39.95" width="20" height="15" preserveAspectRatio="xMidYMid meet" filter="{{logo_filter}}"/>
<g display="{{title_on}}" transform="translate(0 {{t_dy}})"><text x="34.75" y="47.45" text-anchor="middle" font-family="CB Display" font-size="{{title_size}}" fill="{{ink}}">{{title}}</text></g>
<text display="{{sub_on}}" x="34.75" y="53.650000000000006" text-anchor="middle" font-family="CB Sans" font-size="{{sub_size}}" letter-spacing="0.25" fill="{{ink}}">{{subtitle}}</text>
<text display="{{mark_on}}" x="34.75" y="51.35" text-anchor="middle" font-family="CB Display" font-size="11" fill="{{ink}}">CB</text>
</svg>
